<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quranic Name Suggester</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Naskh+Arabic&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Quranic Name Search</h1>
            <p>Discover beautiful Quranic names, starting with the meaning.</p>
        </header>

        <div class="tabs">
            <button class="tab-button" data-tab="chatTab">Generate Quranic Names</button>
            <button class="tab-button active" data-tab="batchTab">Batch Generate</button>
            <button class="tab-button" data-tab="searchTab">Find Root Words</button>
        </div>

        <main>
            <div id="searchTab" class="tab-content">
                <div class="search-controls">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="e.g., justice, mercy, creation...">
                        <button id="searchButton">Search</button>
                    </div>
                    <div class="search-options">
                        <label for="resultLimit">Show results:</label>
                        <select id="resultLimit">
                            <option value="5">5</option>
                            <option value="10" selected>10</option>
                            <option value="20">20</option>
                            <option value="50">50</option>
                        </select>
                        <label for="minSimilarity">Min. Match %:</label>
                        <input type="number" id="minSimilarity" min="0" max="100" value="50" step="5">
                    </div>
                </div>
                <div id="resultsContainer">
                    <!-- Search results will be dynamically inserted here -->
                </div>
            </div>

            <div id="chatTab" class="tab-content">
                <div id="chat-window">
                    <div id="chat-messages">
                        <!-- Chat messages will be dynamically inserted here -->
                         <div class="message ai-message">
                            <div class="message-content">
                                <p>Welcome! What qualities or meanings are you looking for in a name?</p>
                            </div>
                        </div>
                    </div>
                    <div id="chat-input-container">
                        <input type="text" id="chatInput" placeholder="e.g., a name that means 'light' or 'wisdom'...">
                        <button id="sendButton">Send</button>
                    </div>
                </div>
            </div>

            <div id="batchTab" class="tab-content active">
                <div class="generation-controls">
                    <button id="generateAllButton" class="action-button">Start Generation</button>
                    <button id="copyAllButton" class="icon-button" title="Copy all generated names">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                    <button id="copyUnsuccessfulButton" class="icon-button hidden" title="Copy roots with no names">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.72"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.72-1.72"></path></svg>
                    </button>
                </div>
                <div id="all-names-container">
                    <!-- Batch generation results will be displayed here -->
                </div>
            </div>

            <div id="loadingIndicator" class="hidden">
                <div class="spinner"></div>
            </div>
            <div id="error-message" class="hidden"></div>
        </main>

        <footer class="credit">
            Word data from the <a href="http://corpus.quran.com" target="_blank" rel="noopener">Quranic Arabic Corpus</a>, Copyright © Kais Dukes, 2009-2017, maintained by the quran.com team, under the GNU General Public License.
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
